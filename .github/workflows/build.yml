name: build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  # --- Frozen pure-C++ unit tests (no JUCE) — fast gate on every platform change ---
  unit-tests:
    name: unit-tests (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure unit tests
        run: cmake -S tests/unit -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build unit tests
        run: cmake --build build-tests --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run unit tests
        run: ctest --test-dir build-tests --output-on-failure

      - name: Post-condition — test binary exists and is non-empty
        run: test -x build-tests/note_naming_tests && test -s build-tests/note_naming_tests

      - name: Configure TuningEngine tests (lock-free read path, issue #4)
        run: cmake -S tests/tuning_engine -B build-te -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build TuningEngine tests
        run: cmake --build build-te --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run TuningEngine tests
        run: ctest --test-dir build-te --output-on-failure

      - name: Post-condition — TuningEngine test binary exists and is non-empty
        run: test -x build-te/tuning_engine_tests && test -s build-te/tuning_engine_tests

      - name: Configure boundary tests (issue #5 voice-guard validation, U-B1–U-B4)
        run: cmake -S tests/boundary -B build-bd -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build boundary tests
        run: cmake --build build-bd --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run boundary tests
        run: ctest --test-dir build-bd --output-on-failure

      - name: Post-condition — boundary test binary exists and is non-empty
        run: test -x build-bd/voice_frequency_guard_tests && test -s build-bd/voice_frequency_guard_tests

  # --- JUCE integration tests (frozen I1–I7, I13–I16 + remediation I-B1, I-A4): headless
  #     console harness rendering real audio through MicroGuitarProcessor (issue #1/#5/#7) ---
  integration-tests:
    name: integration-tests (ubuntu)
    needs: unit-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libgl1-mesa-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.0-dev \
            libcurl4-openssl-dev

      - name: Configure integration tests
        run: cmake -S tests/integration -B build-it -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build integration tests
        run: cmake --build build-it --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run integration tests
        run: ctest --test-dir build-it --output-on-failure --no-tests=error

      - name: Post-condition — integration test binary exists and is non-empty
        run: |
          bin=$(find build-it -name MicroGuitarIntegrationTests -type f -print -quit)
          test -n "$bin" || { echo "FAIL: no integration test binary found"; exit 1; }
          test -x "$bin" && test -s "$bin" || { echo "FAIL: binary missing or empty: $bin"; exit 1; }
          echo "Integration test binary: $bin"

  # --- Plugin binaries: VST3 + Standalone for Windows, Linux, macOS ---
  plugin:
    name: plugin (${{ matrix.os }})
    needs: integration-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux JUCE build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libgl1-mesa-dev \
            libjack-jackd2-dev \
            libwebkit2gtk-4.0-dev \
            libcurl4-openssl-dev

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Post-condition — VST3 and Standalone artifacts exist and are non-empty
        shell: bash
        run: |
          # NB: a VST3/.app bundle is a DIRECTORY; on Git Bash directory st_size is 0,
          # so `test -s` is wrong there — check contents instead.
          non_empty() {  # $1 = path; true if a non-empty file or a dir containing files
            if [ -d "$1" ]; then
              test -n "$(find "$1" -type f -print -quit)"
            else
              test -s "$1"
            fi
          }
          vst3=$(find build -iname "MicroGuitar*.vst3" -print -quit)
          test -n "$vst3" || { echo "FAIL: no VST3 artifact found"; exit 1; }
          non_empty "$vst3" || { echo "FAIL: VST3 artifact missing or empty"; exit 1; }
          echo "VST3 artifact: $vst3"
          standalone=$(find build -path "*MicroGuitar*" \( -name "MicroGuitar" -o -name "MicroGuitar.exe" -o -name "MicroGuitar.app" \) -print -quit)
          test -n "$standalone" || { echo "FAIL: no Standalone artifact found"; exit 1; }
          non_empty "$standalone" || { echo "FAIL: Standalone artifact missing or empty"; exit 1; }
          echo "Standalone artifact: $standalone"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicroGuitar-${{ matrix.os }}
          path: |
            build/**/*.vst3/**
            build/**/MicroGuitar
            build/**/MicroGuitar.exe
            build/**/MicroGuitar.app/**
          if-no-files-found: error

  # --- Release channel (issue #9): a pushed v* tag becomes a GitHub Release carrying the
  #     three platform artifacts. Untagged pushes keep producing CI artifacts only. ---
  release:
    name: release (tagged only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugin
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Post-condition — all three platform artifacts present and non-empty
        run: |
          for os in windows-2022 ubuntu-22.04 macos-14; do
            d="release-assets/MicroGuitar-$os"
            test -d "$d" || { echo "FAIL: missing artifact dir $d"; exit 1; }
            test -n "$(find "$d" -type f -print -quit)" || { echo "FAIL: empty artifact dir $d"; exit 1; }
          done

      - name: Package per-platform zips
        run: |
          cd release-assets
          for os in windows-2022 ubuntu-22.04 macos-14; do
            zip -qry "MicroGuitar-${{ github.ref_name }}-$os.zip" "MicroGuitar-$os"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
